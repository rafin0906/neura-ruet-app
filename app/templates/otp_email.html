<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuraRUET OTP</title>
</head>

<body style="margin:0;padding:0;background:#000000;font-family:Arial,Helvetica,sans-serif;color:#ffffff;">

    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#000000;padding:40px 0;">
        <tr>
            <td align="center">

                <!-- MAIN CARD -->
                <table width="100%" cellpadding="0" cellspacing="0" border="0"
                    style="max-width:480px;background:#111111;border-radius:16px;padding:40px 32px;">

                    <!-- HEADER -->
                    <tr>
                        <td align="center" style="padding-bottom:20px;">
                            <div style="font-size:26px;font-weight:bold;letter-spacing:1px;">
                                <span style="color:#ffffff;">Neura</span><span style="color:#8BEA5A;">RUET</span>
                            </div>

                            <div style="font-size:13px;color:#9ca3af;margin-top:6px;">
                                RUET intelligence at your service
                            </div>
                        </td>
                    </tr>

                    <!-- TITLE -->
                    <tr>
                        <td align="center" style="padding-top:10px;padding-bottom:25px;">
                            <div style="font-size:20px;font-weight:600;">
                                Password Reset OTP
                            </div>
                        </td>
                    </tr>

                    <!-- MESSAGE -->
                    <tr>
                        <td align="center" style="padding-bottom:20px;">
                            <div style="font-size:14px;color:#cfcfcf;line-height:1.6;">
                                Use the verification code below to reset your password.<br>
                                This code will expire in <b>10 minutes</b>.
                            </div>
                        </td>
                    </tr>

                    <!-- OTP BLOCK -->
                    <tr>
                        <td align="center" style="padding:20px 0;">
                            <div style="
font-size:32px;
letter-spacing:8px;
font-weight:bold;
background:#1a1a1a;
padding:16px 28px;
border-radius:12px;
display:inline-block;
color:#8BEA5A;
">
                                {{OTP_CODE}}
                            </div>
                        </td>
                    </tr>


                    <!-- DIVIDER -->
                    <tr>
                        <td style="padding:30px 0 10px 0;">
                            <hr style="border:none;border-top:1px solid #222;">
                        </td>
                    </tr>

                    <!-- FOOTER -->
                    <tr>
                        <td align="center" style="font-size:12px;color:#888;line-height:1.6;padding-top:10px;">

                            If you did not request this password reset,<br>
                            you can safely ignore this email.

                            <br><br>

                            © 2026 NeuraRUET
                            <br>
                            AI Platform for RUET Students

                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>

</html>
